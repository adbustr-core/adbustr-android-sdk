plugins {
    id 'com.android.library' version '8.9.1' apply false
}

ext {
    // Bumped together with AdbustrSdk.VERSION.
    sdkVersion = '0.2.0'
    // Adapter version is "<sdk version>.<adapter revision>" — the convention MAX
    // expects, so a pure adapter fix doesn't look like an SDK release.
    adapterVersion = '0.2.0.0'

    compileSdkVersion = 34
    minSdkVersion = 21
    targetSdkVersion = 34

    // The MAX SDK is provided by the host app; we only compile against it.
    appLovinSdkVersion = '13.0.0'
}
